name: Trigger auto deployment for gateway-tfc

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/gateway-tfc-AutoDeployTrigger-0becc056-46bd-49c0-a1a7-707964773b4a.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.GATEWAYTFC_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.GATEWAYTFC_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.GATEWAYTFC_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: abossard.azurecr.io
          registryUsername: ${{ secrets.GATEWAYTFC_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.GATEWAYTFC_REGISTRY_PASSWORD }}
          containerAppName: gateway-tfc
          resourceGroup: mt3gateway
          imageToBuild: abossard.azurecr.io/gateway-tfc:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


